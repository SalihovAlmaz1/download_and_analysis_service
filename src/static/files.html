<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Файлы</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
  nav a { margin-right: 16px; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: center; }
  .toolbar { margin: 12px 0; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<nav><a href="/">Скачивание</a> <a href="/files.html">Файлы и расчёты</a></nav>
<h1>Скачанные файлы</h1>

<div class="toolbar">
  <label><input type="checkbox" id="select-page"> выбрать все на странице</label>
  <button id="select-all-btn">выбрать вообще все</button>
  <button id="analyze-btn">Произвести расчёты</button>
</div>

<table>
  <thead><tr><th></th><th>Имя файла</th><th>Скачан</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div class="toolbar">
  <button id="prev-btn">Назад</button>
  <span id="page-label"></span>
  <button id="next-btn">Вперёд</button>
</div>

<div id="results" hidden>
  <h2>Результаты</h2>
  <h3>Общая статистика</h3>
  <table id="total-table"></table>
  <h3>По файлам</h3>
  <table id="per-file-table"></table>
</div>

<script>
let page = 1;
const pageSize = 20;
let totalPages = 1;
let selectAllOverall = false;

async function loadPage() {
  selectAllOverall = false;
  const data = await (await fetch(`/api/files?page=${page}&page_size=${pageSize}&order=desc`)).json();
  totalPages = Math.max(1, Math.ceil(data.total / pageSize));

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const file of data.items) {
    rows.innerHTML += `<tr>
      <td><input type="checkbox" data-id="${file.id}"></td>
      <td>${file.filename}</td>
      <td>${new Date(file.downloaded_at).toLocaleString("ru-RU")}</td>
    </tr>`;
  }
  document.getElementById("select-page").checked = false;
  document.getElementById("page-label").textContent = `Страница ${page} из ${totalPages}`;
}

document.getElementById("select-page").addEventListener("change", (e) => {
  document.querySelectorAll("#rows input[type=checkbox]").forEach(cb => cb.checked = e.target.checked);
});

document.getElementById("select-all-btn").addEventListener("click", () => {
  selectAllOverall = true;
  alert("Выбраны все файлы каталога — расчёт будет по всем.");
});

document.getElementById("prev-btn").addEventListener("click", () => { if (page > 1) { page--; loadPage(); } });
document.getElementById("next-btn").addEventListener("click", () => { if (page < totalPages) { page++; loadPage(); } });

document.getElementById("analyze-btn").addEventListener("click", async () => {
  let payload;
  if (selectAllOverall) {
    payload = { select_all: true };
  } else {
    const ids = [...document.querySelectorAll("#rows input[type=checkbox]:checked")].map(cb => Number(cb.dataset.id));
    if (ids.length === 0) { alert("Выберите хотя бы один файл"); return; }
    payload = { file_ids: ids };
  }

  const res = await fetch("/api/files/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) { alert("Ошибка: " + res.status); return; }
  renderResults(await res.json());
});

function digitsRow(counts) {
  return "<tr>" + [...Array(10).keys()].map(d => `<th>${d}</th>`).join("") + "</tr>"
    + "<tr>" + [...Array(10).keys()].map(d => `<td>${counts[d]}</td>`).join("") + "</tr>";
}

function renderResults(result) {
  document.getElementById("results").hidden = false;
  document.getElementById("total-table").innerHTML = digitsRow(result.total);

  const header = "<tr><th>Файл</th>" + [...Array(10).keys()].map(d => `<th>${d}</th>`).join("") + "</tr>";
  const rows = result.per_file.map(f =>
    `<tr><td>${f.filename}</td>` + [...Array(10).keys()].map(d => `<td>${f.counts[d]}</td>`).join("") + "</tr>"
  ).join("");
  document.getElementById("per-file-table").innerHTML = header + rows;
}

loadPage();
</script>
</body>
</html>
